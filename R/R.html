<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>R</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="R.css">
</head>
<body>

    <div class="line"></div>

    <!-- 1. パスワード入力画面（画面全体を覆う） -->
    <div id="pass-gate">
        <header>
            <img src="R.png" alt="">
            <h1>NSFW</h1>
        </header>
        <main>
            <section>
                <h2>PASS CHECK</h2>
                <p class="pass-desc">
    18禁コンテンツを含みます。<br>
    19歳以上（高校生不可）の方のみ、ご自身の生まれ年を西暦4桁で入力してください。
</p>
                <form onsubmit="checkPassword(event)">
                    <input type="password" id="pass-field" placeholder="YYYY" maxlength="4" autofocus>
                    <button type="submit">ENTER</button>
                </form>
                <p id="pass-error">19歳未満の方は閲覧できません（半角数字4桁）</p>
            </section>
        </main>
    </div>

    <!-- 2. 本文コンテンツ（初期状態は隠す） -->
    <div id="protected-content">
        <header>
            <img src="R.png" alt="">
            <h1>特に表記がなければ爆豪</h1>
        </header>
        <main>
            <section>
                <h2>中篇</h2>
                <ul>
                    きみとするはじめてのこと
                    <li><a href="novelette/01.html">てですること</a></li>
                    <li><a href="novelette/02.html">おくちですること</a></li>
                </ul>
            </section>
            <section>
                <h2>短篇</h2>
                <ul>
                    <li><a href="novel/01.html">エアコンが壊れた部屋で汗だくでする話</a></li>
                    <li><a href="novel/02.html">仕事中のホテルマンに抱かれる話</a></li>
                    <li><a href="novel/03.html">なし崩し的に身体を重ねる話</a></li>
                    <li><a href="novel/04.html">セフレから恋人になる話</a>（烏養繋心）</li>
                </ul>
            </section>
        </main>
    </div>

    <script>
    function checkPassword(event) {
        event.preventDefault(); // リロード防止
        
        const inputPass = document.getElementById("pass-field").value;
        const inputYear = parseInt(inputPass, 10); // 数字に変換

        const errorMsg = document.getElementById("pass-error");
        const gate = document.getElementById("pass-gate");
        const content = document.getElementById("protected-content");

        // ★ 判定条件（19歳以上 ＝ 2007年以前生まれ）
        if (!isNaN(inputYear) && inputYear >= 1920 && inputYear <= 2007) {
            // 条件クリア！入力画面を隠して本文を表示
            gate.style.display = "none";
            content.style.display = "block";
        } else {
            // 2008以降（18歳以下）や数字以外を入力した場合はエラー
            errorMsg.style.display = "block";
            document.getElementById("pass-field").value = "";
        }
    }
    </script>
</body>
</html>
