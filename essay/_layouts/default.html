<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Noto+Serif+JP&display=swap" rel="stylesheet">

    <style>
    /* 全体に適用する */
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-weight: normal;
        font-family: 'Noto Serif JP', serif;
    }

    /* 基本設定 */
    body {
        text-align: center;
        background-color: #fff;
        line-height: 1.7;
        letter-spacing: 0.1em;
        font-size: 11px;
        color: #000;
        padding: 2em 0;
    }

    /* リンク */
    a {
        text-decoration: none;
        color: #000;
    }

    /* アーティクル */
    article {
        margin: 3em auto 2em;
        width: 80%;
        max-width: 400px;
    }

    /* 見出し */
    article h2 {
        margin-bottom: 0.5em;
        padding-left: 0.5em;
        text-align: justify;
        border-left: 5px solid #efefef;
        font-size: 1.1em;
    }

    /* 段落・文章 */
    article p {
        text-align: justify;
        word-break: break-all;
        margin-bottom: 1em;
    }

    /* 日時 */
    article time {
        position: relative;
        display: block;
        margin-top: 1.5em;
    }

    article time span {
        padding: 0 0.5em;
        background-color: #fff;
        font-family: 'Allura', cursive;
        font-size: 1.3em;
    }

    article time::before {
        position: absolute;
        display: block;
        content: '';
        top: 50%;
        left: 50%;
        z-index: -10;
        transform: translate(-50%, -50%);
        width: 200px;
        height: 1px;
        border-top: thin dotted #000;
    }

    /* 追記（more）エリア */
    .more-section {
        margin-top: 2em;
        padding-top: 1em;
        border-top: 1px solid #efefef;
    }
    .more-section h3 {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 0.5em;
        text-align: justify;
    }

    /* メニュー */
    .menu {
        margin-top: 3em;
    }

    .menu li {
        display: inline-block;
        margin: 0 0.5em;
    }

    /* 横幅768px以上で適用 */
    @media screen and (min-width:768px) {
        body {
            font-size: 13px;
        }
    }
    </style>
</head>
<body>

    {{ content }}

</body>
</html>
