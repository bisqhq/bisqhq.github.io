---
layout: default
---

{% for post in site.posts %}
<article>
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    <p>{{ post.content }}</p>
    <time><span>{{ post.date | date: "%Y.%m.%d" }}</span></time>
</article>
{% endfor %}

<div class="menu">
    <ul>
        <li><a href="/">INDEX</a></li>
    </ul>
</div>
