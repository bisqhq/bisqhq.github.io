---
layout: default
---

{% for post in site.posts %}
<article>
    <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
    <p>{{ post.content }}</p>
    <time><span>{{ post.date | date: "%Y.%m.%d" }}</span></time>
</article>
{% endfor %}

<div class="menu">
    <ul>
        <li><a href="{{ '/' | relative_url }}">INDEX</a></li>
        <!-- メインのTOPページに戻るボタンも作りたい場合は以下を追加 -->
        <!-- <li><a href="../">SITE TOP</a></li> -->
    </ul>
</div>
