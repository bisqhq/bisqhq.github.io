<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>誰恋2026</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrp">
<div class="top">
<div class="text">    
    <h2>誰恋2026</h2>

<!-- ▼ 【ステップ1】パスワード入力エリア -->
    <div id="lockArea" class="center" style="margin-top: 3em;">
        <p>この先はWebイベントの合言葉が必要です。</p>
        <p style="margin-bottom: 1em; color: #a0a0a0; font-size: 90%;">合言葉はイベント告知ページをご確認ください。</p>
        
        <div style="text-align: center;">
            <input type="password" id="passInput" placeholder="合言葉" style="width: 120px !important; height: auto !important; font-size: 14px !important; padding: 4px 6px !important; display: inline-block !important; box-sizing: border-box !important;">
            <input type="button" value="○" onclick="checkPassword()" style="width: 40px !important; height: auto !important; font-size: 14px !important; padding: 4px 0 !important; background: #f7dc8d !important; color: #000 !important; border: none !important; cursor: pointer !important; display: inline-block !important; box-sizing: border-box !important;">
        </div>
        
        <center><p id="errorMsg" style="color: #ff0000; display: none; margin-top: 1em;">合言葉が違います</p></center>
    </div>
    
    <!-- ▼ 【ステップ2】合言葉が合っているときだけ表示される本文エリア -->
    <div id="secretContent" class="novel-text" style="display: none;">
        <p><a href="novel/novel2.html">爆豪が初恋に気づき始める話</a></p>
        <p><a href="novel/novel1.html">爆豪のネクタイを結ぶ話</a></p>
        <p>改行もルビも、いつも通りの書き方でOKです。</p>
    </div>

<script>
    function checkPassword() {
        const input = document.getElementById('passInput').value;
        
        // ★合言葉は '0420' に設定中！
        const correctPass = '0420'; 

        if (input === correctPass) {
            // パスワード合致：入力欄を消して、本文を表示する
            document.getElementById('lockArea').style.display = 'none';
            document.getElementById('secretContent').style.display = 'block';
        } else {
            // パスワード間違い：エラーメッセージを出す
            document.getElementById('errorMsg').style.display = 'block';
        }
    }
</script>

</div>
</div>
</div>
</body>
</html>
